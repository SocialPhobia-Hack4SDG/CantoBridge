services:
  - type: web
    name: cantobridge
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --prefix backend
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: off
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: CANTOBRIDGE_MAX_ACCOUNTS
        value: "50"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: CANTOBRIDGE_TURN_PROVIDER
        value: static
      - key: CANTOBRIDGE_TURN_URL
        sync: false
      - key: CANTOBRIDGE_TURN_USERNAME
        sync: false
      - key: CANTOBRIDGE_TURN_CREDENTIAL
        sync: false
      - key: CANTOBRIDGE_INVITE_CODE
        generateValue: true
